name: build-and-specs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet build tests/RateScheduler.Specs -c Release --nologo
      - run: dotnet run --project tests/RateScheduler.Specs -c Release --no-build
      - run: dotnet run --project demo/SchedulerDemo -c Release
